services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: meetflow, POSTGRES_PASSWORD: meetflow, POSTGRES_DB: meetflow }
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U meetflow"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["63799:6379"]
volumes: { pgdata: {} }
