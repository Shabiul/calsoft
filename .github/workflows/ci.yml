name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

env:
  DATABASE_URL: postgres://meetflow:meetflow@localhost:5432/meetflow
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  APP_URL: http://localhost:3000
  APP_NAME: MeetFlow

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: meetflow, POSTGRES_PASSWORD: meetflow, POSTGRES_DB: meetflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meetflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: meetflow, POSTGRES_PASSWORD: meetflow, POSTGRES_DB: meetflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meetflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright test
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.production.example .env.production && docker compose --env-file .env.production -f docker-compose.prod.yml config -q
      - run: docker build -t meetflow-web .
      - run: docker build -f Dockerfile.worker -t meetflow-worker .
